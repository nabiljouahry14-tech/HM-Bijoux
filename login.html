<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HM Bijoux</title>

  <style>
    body {
  margin:0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #1e293b, #020617);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding: 16px;
  color:white;
}

.login-box {
  background: rgba(15,23,42,0.8);
  backdrop-filter: blur(12px);
  padding: clamp(20px, 8vw, 40px);
  border-radius:16px;
  width: 100%;
  max-width: 380px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  animation: fadeIn .5s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

.login-box h2 {
  margin-bottom:20px;
  font-weight:600;
}

.input-group {
  margin-bottom:15px;
}

input {
  width:100%;
  padding: 12px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
  background:#020617;
  color:white;
  font-size: 16px;
  transition:.2s;
  box-sizing: border-box;
  min-height: 44px;
}

input:focus {
  border-color:#0b5fff;
  outline:none;
  box-shadow: 0 0 0 2px rgba(11,95,255,0.2);
}

button {
  width:100%;
  padding: 14px 16px;
  border-radius:10px;
  border:none;
  background: linear-gradient(135deg,#0b5fff,#2563eb);
  color:white;
  font-weight:600;
  font-size: 16px;
  cursor:pointer;
  transition:.2s;
  min-height: 44px;
  box-sizing: border-box;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 25px rgba(11,95,255,0.4);
}

button:active {
  transform: scale(0.98);
}

.error {
  margin-top:10px;
  color:#ef4444;
  font-size:13px;
  opacity:0;
  transform:translateY(5px);
  transition:.2s;
  min-height: 18px;
}

.error.show {
  opacity:1;
  transform:translateY(0);
}
.error {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #ff4d4d;
  font-size: 13px;
}

/* Mobile responsiveness */
@media (max-width: 480px) {
  .login-box {
    padding: clamp(16px, 6vw, 24px);
  }

  .login-box h2 {
    font-size: 20px;
    margin-bottom: 16px;
  }

  .input-group {
    margin-bottom: 12px;
  }

  button {
    padding: 13px 12px;
    font-size: 15px;
  }

  .error {
    font-size: 12px;
    padding: 8px;
    margin-top: 8px;
  }
}
  </style>
</head>

<body>

<div class="login-box">
  <h2>Admin Login</h2>

  <div class="input-group">
    <input id="email" type="email" placeholder="Email">
  </div>
  <div class="input-group">
    <input id="password" type="password" placeholder="Password">
  </div>
  <div class="cf-turnstile" data-sitekey="0x4AAAAAAC-YMjpVw7jAuqcy"></div>

  <button id="loginBtn">Login</button>

  <div class="error" id="errorMsg"></div>
</div>

<script type="module" src="login.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
