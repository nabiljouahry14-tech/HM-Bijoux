<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="success.pageTitle">Order Success</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    /* CHECK CIRCLE */
    .check-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      position: relative;
    }

    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #22c55e;
      position: absolute;
      top: 0;
      left: 0;
      transform: scale(0);
      animation: pop 0.4s ease forwards;
    }

    @keyframes pop {
      to {
        transform: scale(1);
      }
    }

    /* CHECK MARK */
    .check {
      position: absolute;
      width: 60px;
      height: 30px;
      border-left: 4px solid #22c55e;
      border-bottom: 4px solid #22c55e;
      transform: translate(-50%, -50%) rotate(-45deg) scale(0);
      top: 35px;
      left: 30px;
      animation: draw 0.5s ease forwards;
      animation-delay: 0.4s;
    }

    @keyframes draw {
      to {
        transform: rotate(-45deg) scale(1);
      }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    p {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .btn-primary {
      background: #22c55e;
      color: #000;
    }

    .btn-primary:hover {
      background: #16a34a;
    }

    .btn-secondary {
      background: #1f1f1f;
      color: #fff;
      border: 1px solid #333;
    }

    .btn-secondary:hover {
      background: #2a2a2a;
    }
  </style>
  <script src="translations.js"></script>
</head>

<body>
  <div class="container">

    <div class="check-wrapper">
      <div class="circle"></div>
      <div class="check"></div>
    </div>

    <h1 data-i18n="success.title">Order Confirmed</h1>

    <p>
      Thank you for shopping from HM Bijoux. A confirmation has been sent to your email with full order details. You can also track your order anytime from your <a href="orders.html" style="color: #22c55e;">profile</a>.</p>

    <div class="buttons">
      <button class="btn btn-primary" onclick="goHome()" data-i18n="success.continue">Continue Shopping</button>
      <button class="btn btn-secondary" onclick="goOrders()" data-i18n="success.viewOrders">View Orders</button>
    </div>

  </div>

  <script>
    function goHome() {
      window.location.href = "index.html";
    }

    function goOrders() {
      window.location.href = "orders.html";
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedLanguage = localStorage.getItem('language') || 'en';
      setLanguage(savedLanguage);
    });
  </script>
</body>
</html>
